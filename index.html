<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebSocket Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #eef1f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* The app window: sidebar on the left, chat on the right */
    .app {
      width: 100%;
      max-width: 820px;
      height: 90vh;
      max-height: 720px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: #f3f5f8;
      border-right: 1px solid #e6e9ee;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sidebar h2 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #6b7280;
      margin: 18px 16px 6px;
    }
    .list { list-style: none; margin: 0; padding: 0 8px; }
    .item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #374151;
      cursor: pointer;
    }
    .item:hover { background: #e6e9ee; }
    .item.active { background: #3b82f6; color: #fff; }
    .item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .meta { font-size: 0.72rem; color: #9ca3af; }
    .item.active .meta { color: #dbeafe; }
    .badge {
      background: #ef4444;
      color: #fff;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 999px;
    }
    .avatar {
      width: 22px; height: 22px; border-radius: 50%;
      background: #c7d2fe; color: #3730a3;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 600; flex-shrink: 0;
    }
    .empty { font-size: 0.8rem; color: #9ca3af; padding: 4px 16px; }
    #new-room {
      margin: 6px 16px 0;
      padding: 6px 10px;
      border: 1px solid #e6e9ee;
      border-radius: 8px;
      font-size: 0.85rem;
      width: calc(100% - 32px);
    }

    /* Chat panel */
    .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    .header {
      padding: 14px 18px;
      border-bottom: 1px solid #e6e9ee;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header h1 { font-size: 1.05rem; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header .sub { font-weight: 400; color: #9ca3af; font-size: 0.8rem; margin-left: 6px; }
    .status { font-size: 0.8rem; color: #6b7280; display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; }
    .dot.on { background: #22c55e; }
    .dot.off { background: #ef4444; }
    #name {
      width: 120px;
      padding: 6px 10px;
      border: 1px solid #e6e9ee;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    /* Message lists: one per conversation, only the active one is shown */
    #logs { flex: 1; position: relative; background: #f8fafc; }
    .log {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 4px;
    }
    .log.active { display: flex; }

    /* One message row. "mine" goes right, "theirs" goes left. */
    .row { display: flex; flex-direction: column; max-width: 75%; }
    .row.mine   { align-self: flex-end;   align-items: flex-end; }
    .row.theirs { align-self: flex-start; align-items: flex-start; }
    .row.new-sender { margin-top: 10px; }

    .sender { font-size: 0.75rem; color: #6b7280; margin: 0 6px 2px; }

    .bubble {
      padding: 8px 12px;
      border-radius: 16px;
      line-height: 1.35;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .mine .bubble   { background: #3b82f6; color: #fff; border-bottom-right-radius: 4px; }
    .theirs .bubble { background: #fff; color: #111827; border: 1px solid #e6e9ee; border-bottom-left-radius: 4px; }
    .dm-log .mine .bubble { background: #7c3aed; }

    .time { font-size: 0.68rem; color: #9ca3af; margin: 2px 6px 0; }

    /* "Someone joined" notices */
    .info {
      align-self: center;
      font-size: 0.75rem;
      color: #6b7280;
      background: #e9edf2;
      padding: 3px 10px;
      border-radius: 999px;
      margin: 8px 0;
      text-align: center;
    }
    .info.error { background: #fee2e2; color: #b91c1c; }

    /* Typing indicator with bouncing dots */
    #typing {
      height: 26px;
      padding: 0 18px;
      font-size: 0.8rem;
      color: #6b7280;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f8fafc;
    }
    .dots { display: inline-flex; gap: 3px; }
    .dots span {
      width: 5px; height: 5px; border-radius: 50%; background: #9ca3af;
      animation: bounce 1.2s infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    /* Input bar */
    .composer {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #e6e9ee;
    }
    #text {
      flex: 1;
      min-width: 0;
      padding: 10px 14px;
      border: 1px solid #e6e9ee;
      border-radius: 999px;
      font-size: 0.95rem;
      outline: none;
    }
    #text:focus { border-color: #3b82f6; }
    #send {
      padding: 0 18px;
      border: none;
      border-radius: 999px;
      background: #3b82f6;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    #send:hover { background: #2563eb; }
    #send:disabled { background: #93c5fd; cursor: default; }

    /* Small screens: put the sidebar above the chat */
    @media (max-width: 640px) {
      .app { flex-direction: column; height: 100vh; max-height: none; border-radius: 0; }
      .sidebar { width: auto; max-height: 34vh; border-right: none; border-bottom: 1px solid #e6e9ee; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h2>Rooms</h2>
      <ul class="list" id="rooms"></ul>
      <input id="new-room" placeholder="+ Join or create a room" autocomplete="off">

      <h2>Online</h2>
      <ul class="list" id="users"></ul>
    </aside>

    <section class="chat">
      <div class="header">
        <h1 id="title">general</h1>
        <div class="status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div>
        <input id="name" placeholder="Your name" value="Guest" maxlength="30">
      </div>

      <div id="logs"></div>
      <div id="typing"></div>

      <div class="composer">
        <input id="text" placeholder="Type a message…" autocomplete="off">
        <button id="send" disabled>Send</button>
      </div>
    </section>
  </div>

  <script>
    const DEFAULT_ROOMS = ["general", "random", "help"];

    const logs = document.getElementById("logs");
    const titleEl = document.getElementById("title");
    const statusText = document.getElementById("status");
    const dot = document.getElementById("dot");
    const sendBtn = document.getElementById("send");
    const textInput = document.getElementById("text");
    const nameInput = document.getElementById("name");
    const roomsList = document.getElementById("rooms");
    const usersList = document.getElementById("users");
    const newRoomInput = document.getElementById("new-room");

    // The server tells us our own id in a "welcome" message.
    // We compare it with each message's id to decide left or right.
    let myId = null;

    // An id for this browser tab that survives reloads (sessionStorage is kept
    // per tab until the tab is closed). The server uses it as our id, so the
    // messages we sent before a reload still show up on our side.
    let clientId = sessionStorage.getItem("chatClientId");
    if (!clientId) {
      clientId = Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
      sessionStorage.setItem("chatClientId", clientId);
    }
    let currentRoom = null;   // the room the server has us in
    let users = [];           // everyone online: [{ id, name, room }]

    // --- Conversations ---
    // A conversation is either a room ("room:general") or a private chat with
    // one person ("dm:<their id>"). Each one gets its own message list, so
    // switching between them doesn't mix messages up.
    const conversations = new Map(); // key -> { log, lastSenderId, unread, name }
    let activeKey = null;

    function getConversation(key, name) {
      let c = conversations.get(key);
      if (!c) {
        const log = document.createElement("div");
        log.className = "log" + (key.startsWith("dm:") ? " dm-log" : "");
        logs.appendChild(log);
        // oldestId / hasMore / loading are for "scroll up to load older messages".
        c = { log, lastSenderId: null, unread: 0, name, oldestId: null, hasMore: false, loading: false };
        conversations.set(key, c);
        log.addEventListener("scroll", () => maybeLoadOlder(key));
      }
      if (name) c.name = name;
      return c;
    }

    function openConversation(key) {
      activeKey = key;
      const c = getConversation(key);
      c.unread = 0;
      for (const other of conversations.values()) other.log.classList.toggle("active", other === c);
      scrollToBottom(c);
      renderTitle();
      renderSidebar();
      renderTyping();
      textInput.focus();
    }

    function renderTitle() {
      titleEl.textContent = "";
      if (!activeKey) return;
      if (activeKey.startsWith("room:")) {
        const room = activeKey.slice(5);
        titleEl.textContent = "#" + room;
        const sub = document.createElement("span");
        sub.className = "sub";
        sub.textContent = `${users.filter(u => u.room === room).length} here`;
        titleEl.appendChild(sub);
      } else {
        const id = activeKey.slice(3);
        const user = users.find(u => u.id === id);
        titleEl.textContent = "@" + (user ? user.name : getConversation(activeKey).name);
        const sub = document.createElement("span");
        sub.className = "sub";
        sub.textContent = user ? "private chat" : "offline";
        titleEl.appendChild(sub);
      }
    }

    function myName() { return nameInput.value.trim() || "Guest"; }

    // The server stamps every message with the time it was sent (in UTC).
    // Show just the time for today's messages, and the date too for older ones.
    function formatTime(sentAt) {
      const d = sentAt ? new Date(sentAt) : new Date();
      const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      if (d.toDateString() === new Date().toDateString()) return time;
      return d.toLocaleDateString([], { day: "numeric", month: "short" }) + ", " + time;
    }

    function scrollToBottom(c) { c.log.scrollTop = c.log.scrollHeight; }

    // A message arrived in a conversation we're not looking at: count it as unread.
    function markUnread(key) {
      if (key === activeKey) return;
      getConversation(key).unread++;
      renderSidebar();
    }

    // Build one chat bubble. Mine on the right, everyone else's on the left.
    // `prevSenderId` is who sent the message just above it, for grouping.
    function buildRow(msg, prevSenderId) {
      const mine = msg.id === myId;
      const newSender = msg.id !== prevSenderId;

      const row = document.createElement("div");
      row.className = "row " + (mine ? "mine" : "theirs") + (newSender ? " new-sender" : "");

      // Show the name only on others' messages, and only once per group.
      if (!mine && newSender) {
        const sender = document.createElement("div");
        sender.className = "sender";
        sender.textContent = msg.name;
        row.appendChild(sender);
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = msg.text; // textContent (not innerHTML) so nobody can inject HTML
      row.appendChild(bubble);

      const time = document.createElement("div");
      time.className = "time";
      time.textContent = formatTime(msg.sent_at);
      row.appendChild(time);
      return row;
    }

    // A new message arrived: add it at the bottom.
    function addMessage(key, msg) {
      const c = getConversation(key);
      c.log.appendChild(buildRow(msg, c.lastSenderId));
      c.lastSenderId = msg.id;
      if (c.oldestId === null && msg.msg_id) c.oldestId = msg.msg_id;
      scrollToBottom(c);
      markUnread(key);
    }

    // --- Message history (Phase 3) ---

    // Build a batch of saved messages, oldest first, as one fragment.
    function buildHistory(messages) {
      const frag = document.createDocumentFragment();
      let prev = null;
      for (const m of messages) {
        frag.appendChild(buildRow(m, prev));
        prev = m.id;
      }
      return { frag, lastSenderId: prev };
    }

    function showHistory(msg) {
      const c = getConversation("room:" + msg.room);
      c.loading = false;
      c.hasMore = msg.more;
      if (msg.messages.length) c.oldestId = msg.messages[0].msg_id;
      const { frag, lastSenderId } = buildHistory(msg.messages);

      if (msg.older) {
        // Older messages go on top. Keep the view where it was, so the
        // messages the user is reading don't jump away.
        const oldHeight = c.log.scrollHeight;
        c.log.prepend(frag);
        c.log.scrollTop += c.log.scrollHeight - oldHeight;
      } else {
        // Just joined: replace whatever we had with the saved history.
        c.log.textContent = "";
        c.log.appendChild(frag);
        c.lastSenderId = lastSenderId;
        scrollToBottom(c);
      }
      if (!c.hasMore && msg.messages.length) {
        const start = document.createElement("div");
        start.className = "info";
        start.textContent = "This is the start of #" + msg.room;
        c.log.prepend(start);
      }
    }

    // When the user scrolls near the top of a room, ask for older messages.
    function maybeLoadOlder(key) {
      const c = conversations.get(key);
      if (!key.startsWith("room:") || !c.hasMore || c.loading || c.log.scrollTop > 40) return;
      c.loading = true;
      sendJSON({ type: "load_more", before: c.oldestId });
    }

    function addInfo(key, text, isError = false) {
      const c = getConversation(key);
      const div = document.createElement("div");
      div.className = "info" + (isError ? " error" : "");
      div.textContent = text;
      c.log.appendChild(div);
      c.lastSenderId = null; // start a new group after a notice
      scrollToBottom(c);
    }

    // --- Sidebar ---
    function makeItem(label, { active, meta, badge, avatar, onClick }) {
      const li = document.createElement("li");
      li.className = "item" + (active ? " active" : "");
      if (avatar) {
        const a = document.createElement("span");
        a.className = "avatar";
        a.textContent = avatar;
        li.appendChild(a);
      }
      const l = document.createElement("span");
      l.className = "label";
      l.textContent = label;
      li.appendChild(l);
      if (badge) {
        const b = document.createElement("span");
        b.className = "badge";
        b.textContent = badge;
        li.appendChild(b);
      } else if (meta) {
        const m = document.createElement("span");
        m.className = "meta";
        m.textContent = meta;
        li.appendChild(m);
      }
      li.onclick = onClick;
      return li;
    }

    function renderSidebar() {
      // Rooms: the default ones, plus any room someone is in right now.
      const rooms = [...new Set([...DEFAULT_ROOMS, ...users.map(u => u.room), currentRoom].filter(Boolean))];
      roomsList.textContent = "";
      for (const room of rooms) {
        const key = "room:" + room;
        const count = users.filter(u => u.room === room).length;
        roomsList.appendChild(makeItem("# " + room, {
          active: key === activeKey,
          meta: count ? String(count) : "",
          badge: conversations.get(key)?.unread || 0,
          onClick: () => switchRoom(room),
        }));
      }

      // Online users: everyone except me. Click someone to message them privately.
      const others = users.filter(u => u.id !== myId);
      usersList.textContent = "";
      if (others.length === 0) {
        const p = document.createElement("li");
        p.className = "empty";
        p.textContent = "Nobody else is online.";
        usersList.appendChild(p);
      }
      for (const u of others) {
        const key = "dm:" + u.id;
        usersList.appendChild(makeItem(u.name, {
          active: key === activeKey,
          avatar: u.name.charAt(0).toUpperCase(),
          meta: "#" + u.room,
          badge: conversations.get(key)?.unread || 0,
          onClick: () => {
            getConversation(key, u.name);
            openConversation(key);
          },
        }));
      }
    }

    // --- Talking to the server ---

    // 1. Open the connection. Note "ws://" instead of "http://".
    const socket = new WebSocket("ws://localhost:8765");

    function sendJSON(obj) {
      if (socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(obj));
    }

    function switchRoom(room) {
      if (room === currentRoom) {
        openConversation("room:" + room);
      } else {
        sendJSON({ type: "join", room, name: myName() }); // the server replies with "joined"
      }
    }

    // 2. Runs once, when the connection is ready. Join the default room.
    socket.onopen = () => {
      statusText.textContent = "Connected";
      dot.className = "dot on";
      sendBtn.disabled = false;
      sendJSON({ type: "join", room: "general", name: myName(), client_id: clientId });
    };

    // 3. Runs every time the server sends us something, at any moment.
    socket.onmessage = (event) => {
      const msg = JSON.parse(event.data);

      if (msg.type === "welcome") {
        myId = msg.id;

      } else if (msg.type === "joined") {
        // The server moved us into a room (it may have cleaned up the name).
        currentRoom = msg.room;
        myId = msg.id; // the server confirms which id we have
        openConversation("room:" + msg.room);

      } else if (msg.type === "history") {
        showHistory(msg);

      } else if (msg.type === "chat") {
        addMessage("room:" + msg.room, msg);
        clearTyping(msg.id); // they sent it, so they're done typing

      } else if (msg.type === "dm") {
        // If I sent it, the conversation is with the recipient; otherwise with the sender.
        const otherId = msg.id === myId ? msg.to : msg.id;
        const other = users.find(u => u.id === otherId);
        getConversation("dm:" + otherId, other ? other.name : msg.name);
        addMessage("dm:" + otherId, msg);
        clearTyping(msg.id);

      } else if (msg.type === "typing") {
        showTyping(msg.id, msg.name, msg.dm ? "dm:" + msg.id : "room:" + msg.room);

      } else if (msg.type === "info") {
        addInfo("room:" + msg.room, msg.text);

      } else if (msg.type === "users") {
        users = msg.users;
        renderSidebar();
        renderTitle();

      } else if (msg.type === "error") {
        if (activeKey) addInfo(activeKey, msg.text, true);
      }
    };

    // 4. Runs if the connection closes (for example, the server stopped).
    socket.onclose = () => {
      statusText.textContent = "Disconnected";
      dot.className = "dot off";
      sendBtn.disabled = true;
    };

    // --- Typing indicator (receiving side) ---
    // id -> { name, key, timer }. Each person's "typing" disappears 2s after their
    // last keystroke, and only shows in the conversation they're typing in.
    const typers = new Map();
    const typingDiv = document.getElementById("typing");

    function renderTyping() {
      const names = [...typers.values()].filter(t => t.key === activeKey).map(t => t.name);
      typingDiv.textContent = "";
      if (names.length === 0) return;

      const dots = document.createElement("span");
      dots.className = "dots";
      dots.innerHTML = "<span></span><span></span><span></span>";
      typingDiv.appendChild(dots);

      const label = document.createElement("span");
      label.textContent = names.length === 1
        ? `${names[0]} is typing…`
        : `${names.join(", ")} are typing…`;
      typingDiv.appendChild(label);
    }

    function showTyping(id, name, key) {
      const old = typers.get(id);
      if (old) clearTimeout(old.timer);
      typers.set(id, { name, key, timer: setTimeout(() => clearTyping(id), 2000) });
      renderTyping();
    }

    function clearTyping(id) {
      const t = typers.get(id);
      if (!t) return;
      clearTimeout(t.timer);
      typers.delete(id);
      renderTyping();
    }

    // 5. Send a message to whatever conversation is open.
    function send() {
      const text = textInput.value.trim();
      if (!text || !activeKey || socket.readyState !== WebSocket.OPEN) return;
      if (activeKey.startsWith("dm:")) {
        sendJSON({ type: "dm", to: activeKey.slice(3), text });
      } else if (activeKey === "room:" + currentRoom) {
        sendJSON({ type: "chat", text });
      }
      textInput.value = "";
      textInput.focus();
    }

    sendBtn.onclick = send;
    textInput.onkeydown = (e) => { if (e.key === "Enter") send(); };

    // Tell the server when the name changes, so everyone's online list updates.
    nameInput.onchange = () => sendJSON({ type: "rename", name: myName() });
    nameInput.onkeydown = (e) => { if (e.key === "Enter") nameInput.blur(); };

    newRoomInput.onkeydown = (e) => {
      if (e.key !== "Enter") return;
      const room = newRoomInput.value.trim();
      if (room) switchRoom(room);
      newRoomInput.value = "";
    };

    // --- Typing indicator (sending side) ---
    // Sending on every keystroke would flood the server, so send at most once per second.
    let lastTypingSent = 0;
    textInput.oninput = () => {
      const now = Date.now();
      if (now - lastTypingSent < 1000 || !activeKey) return;
      lastTypingSent = now;
      sendJSON(activeKey.startsWith("dm:")
        ? { type: "typing", to: activeKey.slice(3) }
        : { type: "typing" });
    };
  </script>
</body>
</html>
