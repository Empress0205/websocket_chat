<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebSocket Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #eef1f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* The app window: sidebar on the left, chat on the right */
    .app {
      width: 100%;
      max-width: 820px;
      height: 90vh;
      max-height: 720px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: #f3f5f8;
      border-right: 1px solid #e6e9ee;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sidebar h2 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #6b7280;
      margin: 18px 16px 6px;
    }
    .list { list-style: none; margin: 0; padding: 0 8px; }
    .item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #374151;
      cursor: pointer;
    }
    .item:hover { background: #e6e9ee; }
    .item.active { background: #3b82f6; color: #fff; }
    .item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .meta { font-size: 0.72rem; color: #9ca3af; }
    .item.active .meta { color: #dbeafe; }
    .badge {
      background: #ef4444;
      color: #fff;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 999px;
    }
    .avatar {
      width: 22px; height: 22px; border-radius: 50%;
      background: #c7d2fe; color: #3730a3;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 600; flex-shrink: 0;
    }
    .empty { font-size: 0.8rem; color: #9ca3af; padding: 4px 16px; }
    .hidden { display: none !important; }
    #manage-rooms {
      margin: 12px 16px 16px;
      padding: 8px 10px;
      border: 1px dashed #93c5fd;
      border-radius: 8px;
      background: #eff6ff;
      color: #1d4ed8;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }
    #manage-rooms:hover { background: #dbeafe; }

    /* Admin panel: create private rooms and choose who may enter them */
    #admin {
      position: fixed; inset: 0; z-index: 9;
      background: rgba(17, 24, 39, 0.35);
      display: flex; align-items: center; justify-content: center;
    }
    .admin-card {
      width: 100%; max-width: 460px; max-height: 80vh; overflow-y: auto;
      background: #fff; border-radius: 16px; padding: 22px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      display: flex; flex-direction: column; gap: 14px;
    }
    .admin-head { display: flex; align-items: center; justify-content: space-between; }
    .admin-head h2 { margin: 0; font-size: 1.1rem; }
    #admin-close { border: none; background: none; font-size: 1.4rem; cursor: pointer; color: #6b7280; }
    .row-form { display: flex; gap: 8px; }
    .row-form input {
      flex: 1; min-width: 0; padding: 8px 10px;
      border: 1px solid #e6e9ee; border-radius: 8px; font-size: 0.9rem;
    }
    .row-form button {
      padding: 0 14px; border: none; border-radius: 8px;
      background: #3b82f6; color: #fff; font-weight: 600; cursor: pointer;
    }
    .admin-room { border: 1px solid #e6e9ee; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .admin-room-name { font-weight: 600; }
    .admin-room-name span { font-weight: 400; color: #9ca3af; font-size: 0.8rem; margin-left: 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: #eef2ff; color: #3730a3; border-radius: 999px;
      padding: 3px 4px 3px 10px; font-size: 0.8rem;
    }
    .chip button { border: none; background: none; color: #6366f1; cursor: pointer; font-size: 0.95rem; line-height: 1; }
    .muted { color: #9ca3af; font-size: 0.8rem; }
    /* Small outline lock for private rooms; it takes the colour of the text around it */
    .lock { width: 12px; height: 12px; margin-right: 5px; vertical-align: -1px; opacity: 0.75; }
    .row-form select {
      flex: 1; min-width: 0; padding: 8px 10px;
      border: 1px solid #e6e9ee; border-radius: 8px; font-size: 0.9rem; background: #fff;
    }
    #admin-msg { margin: 0; align-self: stretch; }
    .admin-sub { margin: 4px 0 -4px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: #6b7280; }
    #admin-rooms { display: flex; flex-direction: column; gap: 10px; }

    /* Chat panel */
    .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    .header {
      padding: 14px 18px;
      border-bottom: 1px solid #e6e9ee;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header h1 { font-size: 1.05rem; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header .sub { font-weight: 400; color: #9ca3af; font-size: 0.8rem; margin-left: 6px; }
    .status { font-size: 0.8rem; color: #6b7280; display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; }
    .dot.on { background: #22c55e; }
    .dot.off { background: #ef4444; }
    .me { font-size: 0.8rem; color: #6b7280; white-space: nowrap; }
    .me b { color: #111827; }
    #logout {
      padding: 6px 10px;
      border: 1px solid #e6e9ee;
      border-radius: 8px;
      background: #fff;
      font-size: 0.8rem;
      cursor: pointer;
    }
    #logout:hover { background: #f3f5f8; }

    /* Log-in / sign-up screen, shown over the chat until you're logged in */
    #login {
      position: fixed;
      inset: 0;
      background: rgba(238, 241, 245, 0.96);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #login.hidden { display: none; }
    .login-card {
      width: 100%;
      max-width: 340px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .login-card h2 { margin: 0 0 4px; font-size: 1.2rem; }
    .login-card input {
      padding: 10px 12px;
      border: 1px solid #e6e9ee;
      border-radius: 10px;
      font-size: 0.95rem;
    }
    .login-card input:focus { outline: none; border-color: #3b82f6; }
    #login-submit {
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    #login-submit:disabled { background: #93c5fd; cursor: default; }
    .hint { font-size: 0.8rem; color: #9ca3af; margin: 0; text-align: center; }
    #login-error { font-size: 0.85rem; color: #b91c1c; min-height: 1.2em; margin: 0; }

    /* Message lists: one per conversation, only the active one is shown */
    #logs { flex: 1; position: relative; background: #f8fafc; }
    .log {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 4px;
    }
    .log.active { display: flex; }

    /* One message row. "mine" goes right, "theirs" goes left. */
    .row { display: flex; flex-direction: column; max-width: 75%; }
    .row.mine   { align-self: flex-end;   align-items: flex-end; }
    .row.theirs { align-self: flex-start; align-items: flex-start; }
    .row.new-sender { margin-top: 10px; }

    .sender { font-size: 0.75rem; color: #6b7280; margin: 0 6px 2px; }

    .bubble {
      padding: 8px 12px;
      border-radius: 16px;
      line-height: 1.35;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .mine .bubble   { background: #3b82f6; color: #fff; border-bottom-right-radius: 4px; }
    .theirs .bubble { background: #fff; color: #111827; border: 1px solid #e6e9ee; border-bottom-left-radius: 4px; }
    .dm-log .mine .bubble { background: #7c3aed; }

    .time { font-size: 0.68rem; color: #9ca3af; margin: 2px 6px 0; }

    /* "Someone joined" notices */
    .info {
      align-self: center;
      font-size: 0.75rem;
      color: #6b7280;
      background: #e9edf2;
      padding: 3px 10px;
      border-radius: 999px;
      margin: 8px 0;
      text-align: center;
    }
    .info.error { background: #fee2e2; color: #b91c1c; }

    /* Typing indicator with bouncing dots */
    #typing {
      height: 26px;
      padding: 0 18px;
      font-size: 0.8rem;
      color: #6b7280;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f8fafc;
    }
    .dots { display: inline-flex; gap: 3px; }
    .dots span {
      width: 5px; height: 5px; border-radius: 50%; background: #9ca3af;
      animation: bounce 1.2s infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    /* Input bar */
    .composer {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #e6e9ee;
    }
    #text {
      flex: 1;
      min-width: 0;
      padding: 10px 14px;
      border: 1px solid #e6e9ee;
      border-radius: 999px;
      font-size: 0.95rem;
      outline: none;
    }
    #text:focus { border-color: #3b82f6; }
    #send {
      padding: 0 18px;
      border: none;
      border-radius: 999px;
      background: #3b82f6;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    #send:hover { background: #2563eb; }
    #send:disabled { background: #93c5fd; cursor: default; }

    /* Small screens: put the sidebar above the chat */
    @media (max-width: 640px) {
      .app { flex-direction: column; height: 100vh; max-height: none; border-radius: 0; }
      .sidebar { width: auto; max-height: 34vh; border-right: none; border-bottom: 1px solid #e6e9ee; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h2>Rooms</h2>
      <ul class="list" id="rooms"></ul>

      <h2>Online</h2>
      <ul class="list" id="users"></ul>

      <!-- Only admins see this button -->
      <button id="manage-rooms" class="hidden">Admin</button>
    </aside>

    <section class="chat">
      <div class="header">
        <h1 id="title">general</h1>
        <div class="status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div>
        <span class="me">Signed in as <b id="me-name"></b></span>
        <button id="logout">Log out</button>
      </div>

      <div id="logs"></div>
      <div id="typing"></div>

      <div class="composer">
        <input id="text" placeholder="Type a message…" autocomplete="off">
        <button id="send" disabled>Send</button>
      </div>
    </section>
  </div>

  <!-- Admin panel (only admins can open it, and the server checks again) -->
  <div id="admin" class="hidden">
    <div class="admin-card">
      <div class="admin-head">
        <h2>Admin</h2>
        <button id="admin-close" title="Close">&times;</button>
      </div>
      <h3 class="admin-sub">Accounts</h3>
      <form class="row-form" id="create-user">
        <input id="new-username" placeholder="Username" maxlength="20" autocomplete="off">
        <input id="new-password" placeholder="Starting password" maxlength="128" autocomplete="new-password">
        <button>Create</button>
      </form>
      <p class="muted">3 to 20 letters, digits or _. Password at least 8 characters. Give the person their password yourself.</p>

      <h3 class="admin-sub">Rooms</h3>
      <form class="row-form" id="create-room">
        <input id="create-room-name" placeholder="New private room, e.g. bank-x" maxlength="20" autocomplete="off">
        <button>Create</button>
      </form>
      <!-- Kept outside #admin-rooms, so redrawing the list doesn't wipe the message -->
      <p id="admin-msg" class="info hidden"></p>
      <div id="admin-rooms"></div>
    </div>
  </div>

  <!-- Phase 4: nothing works until you log in -->
  <div id="login">
    <form class="login-card" id="login-form">
      <h2>WebSocket Chat</h2>
      <input id="username" placeholder="Username" autocomplete="username" maxlength="20" required>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" maxlength="128" required>
      <button id="login-submit" disabled>Log in</button>
      <p id="login-error"></p>
      <p class="hint">No account? Accounts are created by your admin.</p>
    </form>
  </div>

  <script>
    // The rooms we may enter come from the server after we log in.
    let myRooms = [];   // [{ name, public }]
    let isAdmin = false;

    const logs = document.getElementById("logs");
    const titleEl = document.getElementById("title");
    const statusText = document.getElementById("status");
    const dot = document.getElementById("dot");
    const sendBtn = document.getElementById("send");
    const textInput = document.getElementById("text");
    const roomsList = document.getElementById("rooms");
    const usersList = document.getElementById("users");

    // Our user id and name come from our account once we log in.
    // We compare the id with each message's id to decide left or right.
    let myId = null;
    let myName = null;
    let currentRoom = null;   // the room the server has us in
    let users = [];           // everyone online: [{ id, name, room }]

    // --- Conversations ---
    // A conversation is either a room ("room:general") or a private chat with
    // one person ("dm:<their id>"). Each one gets its own message list, so
    // switching between them doesn't mix messages up.
    const conversations = new Map(); // key -> { log, lastSenderId, unread, name }
    let activeKey = null;

    function getConversation(key, name) {
      let c = conversations.get(key);
      if (!c) {
        const log = document.createElement("div");
        log.className = "log" + (key.startsWith("dm:") ? " dm-log" : "");
        logs.appendChild(log);
        // oldestId / hasMore / loading are for "scroll up to load older messages".
        c = { log, lastSenderId: null, unread: 0, name, oldestId: null, hasMore: false, loading: false, historyAsked: false };
        conversations.set(key, c);
        log.addEventListener("scroll", () => maybeLoadOlder(key));
      }
      if (name) c.name = name;
      return c;
    }

    function openConversation(key) {
      activeKey = key;
      const c = getConversation(key);
      c.unread = 0;
      // The first time a private chat is opened, ask for what was said before.
      if (key.startsWith("dm:") && !c.historyAsked) {
        c.historyAsked = true;
        sendJSON({ type: "dm_history", with: key.slice(3) });
      }
      for (const other of conversations.values()) other.log.classList.toggle("active", other === c);
      scrollToBottom(c);
      renderTitle();
      renderSidebar();
      renderTyping();
      textInput.focus();
    }

    function renderTitle() {
      titleEl.textContent = "";
      if (!activeKey) return;
      if (activeKey.startsWith("room:")) {
        const room = activeKey.slice(5);
        titleEl.textContent = "#" + room;
        const sub = document.createElement("span");
        sub.className = "sub";
        sub.textContent = `${users.filter(u => u.room === room).length} here`;
        titleEl.appendChild(sub);
      } else {
        const id = activeKey.slice(3);
        const user = users.find(u => u.id === id);
        titleEl.textContent = "@" + (user ? user.name : getConversation(activeKey).name);
        const sub = document.createElement("span");
        sub.className = "sub";
        sub.textContent = user ? "private chat" : "offline";
        titleEl.appendChild(sub);
      }
    }


    // The server stamps every message with the time it was sent (in UTC).
    // Show just the time for today's messages, and the date too for older ones.
    function formatTime(sentAt) {
      const d = sentAt ? new Date(sentAt) : new Date();
      const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      if (d.toDateString() === new Date().toDateString()) return time;
      return d.toLocaleDateString([], { day: "numeric", month: "short" }) + ", " + time;
    }

    function scrollToBottom(c) { c.log.scrollTop = c.log.scrollHeight; }

    // A message arrived in a conversation we're not looking at: count it as unread.
    function markUnread(key) {
      if (key === activeKey) return;
      getConversation(key).unread++;
      renderSidebar();
    }

    // Build one chat bubble. Mine on the right, everyone else's on the left.
    // `prevSenderId` is who sent the message just above it, for grouping.
    function buildRow(msg, prevSenderId) {
      const mine = msg.id === myId;
      const newSender = msg.id !== prevSenderId;

      const row = document.createElement("div");
      row.className = "row " + (mine ? "mine" : "theirs") + (newSender ? " new-sender" : "");

      // Show the name only on others' messages, and only once per group.
      if (!mine && newSender) {
        const sender = document.createElement("div");
        sender.className = "sender";
        sender.textContent = msg.name;
        row.appendChild(sender);
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = msg.text; // textContent (not innerHTML) so nobody can inject HTML
      row.appendChild(bubble);

      const time = document.createElement("div");
      time.className = "time";
      time.textContent = formatTime(msg.sent_at);
      row.appendChild(time);
      return row;
    }

    // A new message arrived: add it at the bottom.
    function addMessage(key, msg) {
      const c = getConversation(key);
      c.log.appendChild(buildRow(msg, c.lastSenderId));
      c.lastSenderId = msg.id;
      if (c.oldestId === null && msg.msg_id) c.oldestId = msg.msg_id;
      scrollToBottom(c);
      markUnread(key);
    }

    // --- Message history (Phase 3) ---

    // Build a batch of saved messages, oldest first, as one fragment.
    function buildHistory(messages) {
      const frag = document.createDocumentFragment();
      let prev = null;
      for (const m of messages) {
        frag.appendChild(buildRow(m, prev));
        prev = m.id;
      }
      return { frag, lastSenderId: prev };
    }

    function showHistory(msg) {
      // History is either for a room or for a private chat with one person.
      const c = getConversation(msg.dm ? "dm:" + msg.dm : "room:" + msg.room);
      c.loading = false;
      c.hasMore = msg.more;
      if (msg.messages.length) c.oldestId = msg.messages[0].msg_id;
      const { frag, lastSenderId } = buildHistory(msg.messages);

      if (msg.older) {
        // Older messages go on top. Keep the view where it was, so the
        // messages the user is reading don't jump away.
        const oldHeight = c.log.scrollHeight;
        c.log.prepend(frag);
        c.log.scrollTop += c.log.scrollHeight - oldHeight;
      } else {
        // Just joined: replace whatever we had with the saved history.
        c.log.textContent = "";
        c.log.appendChild(frag);
        c.lastSenderId = lastSenderId;
        scrollToBottom(c);
      }
      if (!c.hasMore && msg.messages.length) {
        const start = document.createElement("div");
        start.className = "info";
        start.textContent = msg.dm ? "This is the start of your private chat with " + c.name : "This is the start of #" + msg.room;
        c.log.prepend(start);
      }
    }

    // When the user scrolls near the top of a conversation, ask for older messages.
    function maybeLoadOlder(key) {
      const c = conversations.get(key);
      if (!c.hasMore || c.loading || c.log.scrollTop > 40) return;
      c.loading = true;
      sendJSON(key.startsWith("dm:")
        ? { type: "load_more", before: c.oldestId, with: key.slice(3) }
        : { type: "load_more", before: c.oldestId });
    }

    function addInfo(key, text, isError = false) {
      const c = getConversation(key);
      const div = document.createElement("div");
      div.className = "info" + (isError ? " error" : "");
      div.textContent = text;
      c.log.appendChild(div);
      c.lastSenderId = null; // start a new group after a notice
      scrollToBottom(c);
    }

    // --- Sidebar ---
    // A small outline padlock, drawn with SVG so it matches the text colour.
    function lockIcon() {
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("viewBox", "0 0 16 16");
      svg.setAttribute("class", "lock");
      svg.setAttribute("aria-label", "private");
      for (const d of ["M4 7h8v7H4z", "M5.5 7V5a2.5 2.5 0 0 1 5 0v2"]) {
        const path = document.createElementNS(ns, "path");
        path.setAttribute("d", d);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "currentColor");
        path.setAttribute("stroke-width", "1.5");
        path.setAttribute("stroke-linejoin", "round");
        svg.appendChild(path);
      }
      return svg;
    }

    // Public rooms get a "#", private ones the lock.
    function roomLabel(el, name, isPublic) {
      el.textContent = isPublic ? "# " + name : name;
      if (!isPublic) el.prepend(lockIcon());
    }

    function makeItem(label, { active, meta, badge, avatar, onClick, isPrivate }) {
      const li = document.createElement("li");
      li.className = "item" + (active ? " active" : "");
      if (avatar) {
        const a = document.createElement("span");
        a.className = "avatar";
        a.textContent = avatar;
        li.appendChild(a);
      }
      const l = document.createElement("span");
      l.className = "label";
      l.textContent = label;
      if (isPrivate) l.prepend(lockIcon());
      li.appendChild(l);
      if (badge) {
        const b = document.createElement("span");
        b.className = "badge";
        b.textContent = badge;
        li.appendChild(b);
      } else if (meta) {
        const m = document.createElement("span");
        m.className = "meta";
        m.textContent = meta;
        li.appendChild(m);
      }
      li.onclick = onClick;
      return li;
    }

    function renderSidebar() {
      // Rooms: only the ones the server says we may enter.
      roomsList.textContent = "";
      for (const { name: room, public: isPublic } of myRooms) {
        const key = "room:" + room;
        const count = users.filter(u => u.room === room).length;
        roomsList.appendChild(makeItem(isPublic ? "# " + room : room, {
          isPrivate: !isPublic,
          active: key === activeKey,
          meta: count ? String(count) : "",
          badge: conversations.get(key)?.unread || 0,
          onClick: () => switchRoom(room),
        }));
      }

      // Online users: everyone except me. Click someone to message them privately.
      const others = users.filter(u => u.id !== myId);
      usersList.textContent = "";
      if (others.length === 0) {
        const p = document.createElement("li");
        p.className = "empty";
        p.textContent = "Nobody else is online.";
        usersList.appendChild(p);
      }
      for (const u of others) {
        const key = "dm:" + u.id;
        usersList.appendChild(makeItem(u.name, {
          active: key === activeKey,
          avatar: u.name.charAt(0).toUpperCase(),
          meta: u.room ? "#" + u.room : "", // hidden if it's a private room we can't enter
          badge: conversations.get(key)?.unread || 0,
          onClick: () => {
            getConversation(key, u.name);
            openConversation(key);
          },
        }));
      }
    }

    // --- Talking to the server ---

    // 1. Open the connection. Note "ws://" instead of "http://".
    const socket = new WebSocket("ws://localhost:8765");

    function sendJSON(obj) {
      if (socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(obj));
    }

    function switchRoom(room) {
      if (room === currentRoom) {
        openConversation("room:" + room);
      } else {
        sendJSON({ type: "join", room }); // the server replies with "joined"
      }
    }

    // --- Logging in (Phase 4) ---
    // After logging in, the server gives us a token. We keep it in
    // sessionStorage (this tab only, until the tab closes), so a reload logs us
    // straight back in without typing the password again.
    const loginScreen = document.getElementById("login");
    const loginForm = document.getElementById("login-form");
    const loginError = document.getElementById("login-error");
    const loginSubmit = document.getElementById("login-submit");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");

    function showLogin(error = "") {
      loginScreen.classList.remove("hidden");
      loginError.textContent = error;
      loginSubmit.disabled = socket.readyState !== WebSocket.OPEN;
      usernameInput.focus();
    }

    loginForm.onsubmit = (e) => {
      e.preventDefault(); // stop the browser reloading the page like a normal form
      loginError.textContent = "";
      loginSubmit.disabled = true;
      sendJSON({ type: "login", username: usernameInput.value.trim(), password: passwordInput.value });
    };

    document.getElementById("logout").onclick = () => sendJSON({ type: "logout" });

    // 2. Runs once, when the connection is ready: log back in, or show the login screen.
    socket.onopen = () => {
      statusText.textContent = "Connected";
      dot.className = "dot on";
      const token = sessionStorage.getItem("chatToken");
      if (token) {
        sendJSON({ type: "resume", token });
      } else {
        showLogin();
      }
    };

    // 3. Runs every time the server sends us something, at any moment.
    socket.onmessage = (event) => {
      const msg = JSON.parse(event.data);

      if (msg.type === "auth_ok") {
        // Logged in. Keep the token (only sent on a fresh login) and join a room.
        if (msg.token) sessionStorage.setItem("chatToken", msg.token);
        myId = msg.user.id;
        myName = msg.user.name;
        document.getElementById("me-name").textContent = myName;
        loginScreen.classList.add("hidden");
        passwordInput.value = "";
        sendBtn.disabled = false;
        // Go back to the room this tab was in before a reload (the server
        // checks access and falls back to #general if it's not allowed).
        sendJSON({ type: "join", room: sessionStorage.getItem("chatRoom") || "general" });

      } else if (msg.type === "auth_error") {
        // A saved token that no longer works is useless: forget it.
        sessionStorage.removeItem("chatToken");
        showLogin(msg.text);

      } else if (msg.type === "signed_out") {
        // We logged out, or logged in from another tab. The server closes the
        // connection next, and onclose shows the login screen.
        sessionStorage.removeItem("chatToken");
        signedOutText = msg.text;

      } else if (msg.type === "joined") {
        // The server moved us into a room (it may have cleaned up the name).
        currentRoom = msg.room;
        sessionStorage.setItem("chatRoom", msg.room); // remembered across reloads
        openConversation("room:" + msg.room);

      } else if (msg.type === "history") {
        showHistory(msg);

      } else if (msg.type === "chat") {
        addMessage("room:" + msg.room, msg);
        clearTyping(msg.id); // they sent it, so they're done typing

      } else if (msg.type === "dm") {
        // If I sent it, the conversation is with the recipient; otherwise with the sender.
        const otherId = msg.id === myId ? msg.to : msg.id;
        const other = users.find(u => u.id === otherId);
        getConversation("dm:" + otherId, other ? other.name : msg.name);
        addMessage("dm:" + otherId, msg);
        clearTyping(msg.id);

      } else if (msg.type === "typing") {
        showTyping(msg.id, msg.name, msg.dm ? "dm:" + msg.id : "room:" + msg.room);

      } else if (msg.type === "info") {
        addInfo("room:" + msg.room, msg.text);

      } else if (msg.type === "users") {
        users = msg.users;
        renderSidebar();
        renderTitle();

      } else if (msg.type === "rooms") {
        // The rooms we may enter. Sent after logging in and whenever an admin changes them.
        myRooms = msg.rooms;
        isAdmin = msg.admin;
        document.getElementById("manage-rooms").classList.toggle("hidden", !isAdmin);
        renderSidebar();

      } else if (msg.type === "admin_rooms") {
        renderAdmin(msg.rooms, msg.users);

      } else if (msg.type === "notice") {
        if (!adminPanel.classList.contains("hidden")) adminError(msg.text, false);
        else if (activeKey) addInfo(activeKey, msg.text);

      } else if (msg.type === "error") {
        if (!adminPanel.classList.contains("hidden")) adminError(msg.text);
        else if (activeKey) addInfo(activeKey, msg.text, true);
      }
    };

    // --- Admin panel ---
    // The page only shows the panel to admins, but that's just convenience:
    // the server checks admin rights again on every admin_* message.
    const adminPanel = document.getElementById("admin");
    const adminRooms = document.getElementById("admin-rooms");
    const adminMsg = document.getElementById("admin-msg");

    // Send an admin action, clearing the last message first.
    function adminSend(obj) {
      adminMsg.classList.add("hidden");
      sendJSON(obj);
    }

    document.getElementById("manage-rooms").onclick = () => {
      adminPanel.classList.remove("hidden");
      adminSend({ type: "admin_list" });
    };
    document.getElementById("admin-close").onclick = () => adminPanel.classList.add("hidden");

    document.getElementById("create-room").onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById("create-room-name");
      if (input.value.trim()) adminSend({ type: "admin_create_room", name: input.value.trim() });
      input.value = "";
    };

    function adminError(text, isError = true) {
      adminMsg.textContent = text;
      adminMsg.classList.toggle("error", isError);
      adminMsg.classList.remove("hidden");
    }

    document.getElementById("create-user").onsubmit = (e) => {
      e.preventDefault();
      const username = document.getElementById("new-username");
      const password = document.getElementById("new-password");
      adminSend({ type: "admin_create_user", username: username.value.trim(), password: password.value });
      username.value = "";
      password.value = "";
    };

    // `allUsers` is every account's username, for the "add a member" dropdown.
    function renderAdmin(rooms, allUsers) {
      adminRooms.textContent = "";
      for (const room of rooms) {
        const box = document.createElement("div");
        box.className = "admin-room";

        const title = document.createElement("div");
        title.className = "admin-room-name";
        roomLabel(title, room.name, room.public);
        const kind = document.createElement("span");
        kind.textContent = room.public ? "public, everyone can enter" : "private";
        title.appendChild(kind);
        box.appendChild(title);

        if (!room.public) {
          // Members, each with a remove button.
          const chips = document.createElement("div");
          chips.className = "chips";
          if (room.members.length === 0) {
            const none = document.createElement("span");
            none.className = "muted";
            none.textContent = "No members yet. Only admins can enter.";
            chips.appendChild(none);
          }
          for (const member of room.members) {
            const chip = document.createElement("span");
            chip.className = "chip";
            chip.textContent = member;
            const x = document.createElement("button");
            x.textContent = "\u00d7";
            x.title = "Remove " + member;
            x.onclick = () => adminSend({ type: "admin_remove_member", room: room.name, username: member });
            chip.appendChild(x);
            chips.appendChild(chip);
          }
          box.appendChild(chips);

          // Add someone: pick from the accounts that aren't members yet,
          // so a typo can't send a name that doesn't exist.
          const candidates = allUsers.filter(u => !room.members.includes(u));
          if (candidates.length === 0) {
            const all = document.createElement("span");
            all.className = "muted";
            all.textContent = "Every account is already a member.";
            box.appendChild(all);
          } else {
            const form = document.createElement("form");
            form.className = "row-form";
            const select = document.createElement("select");
            const placeholder = new Option("Choose someone to add…", "");
            placeholder.disabled = true;
            placeholder.selected = true;
            select.appendChild(placeholder);
            for (const u of candidates) select.appendChild(new Option(u, u));
            const add = document.createElement("button");
            add.textContent = "Add";
            form.append(select, add);
            form.onsubmit = (e) => {
              e.preventDefault();
              if (select.value) adminSend({ type: "admin_add_member", room: room.name, username: select.value });
              else adminError("Choose someone from the list first.");
            };
            box.appendChild(form);
          }
        }
        adminRooms.appendChild(box);
      }
    }

    // 4. Runs if the connection closes (for example, the server stopped).
    let signedOutText = null;
    socket.onclose = () => {
      statusText.textContent = "Disconnected";
      dot.className = "dot off";
      sendBtn.disabled = true;
      if (signedOutText) {
        // We were signed out on purpose: say so on the login screen.
        showLogin(signedOutText + " Reload the page to log in again.");
      }
    };

    // --- Typing indicator (receiving side) ---
    // id -> { name, key, timer }. Each person's "typing" disappears 2s after their
    // last keystroke, and only shows in the conversation they're typing in.
    const typers = new Map();
    const typingDiv = document.getElementById("typing");

    function renderTyping() {
      const names = [...typers.values()].filter(t => t.key === activeKey).map(t => t.name);
      typingDiv.textContent = "";
      if (names.length === 0) return;

      const dots = document.createElement("span");
      dots.className = "dots";
      dots.innerHTML = "<span></span><span></span><span></span>";
      typingDiv.appendChild(dots);

      const label = document.createElement("span");
      label.textContent = names.length === 1
        ? `${names[0]} is typing…`
        : `${names.join(", ")} are typing…`;
      typingDiv.appendChild(label);
    }

    function showTyping(id, name, key) {
      const old = typers.get(id);
      if (old) clearTimeout(old.timer);
      typers.set(id, { name, key, timer: setTimeout(() => clearTyping(id), 2000) });
      renderTyping();
    }

    function clearTyping(id) {
      const t = typers.get(id);
      if (!t) return;
      clearTimeout(t.timer);
      typers.delete(id);
      renderTyping();
    }

    // 5. Send a message to whatever conversation is open.
    function send() {
      const text = textInput.value.trim();
      if (!text || !activeKey || socket.readyState !== WebSocket.OPEN) return;
      if (activeKey.startsWith("dm:")) {
        sendJSON({ type: "dm", to: activeKey.slice(3), text });
      } else if (activeKey === "room:" + currentRoom) {
        sendJSON({ type: "chat", text });
      }
      textInput.value = "";
      textInput.focus();
    }

    sendBtn.onclick = send;
    textInput.onkeydown = (e) => { if (e.key === "Enter") send(); };



    // --- Typing indicator (sending side) ---
    // Sending on every keystroke would flood the server, so send at most once per second.
    let lastTypingSent = 0;
    textInput.oninput = () => {
      const now = Date.now();
      if (now - lastTypingSent < 1000 || !activeKey) return;
      lastTypingSent = now;
      sendJSON(activeKey.startsWith("dm:")
        ? { type: "typing", to: activeKey.slice(3) }
        : { type: "typing" });
    };
  </script>
</body>
</html>
